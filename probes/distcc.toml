name        = "distcc"
description = "Compiles leave this machine when somebody offers capacity, and still happen when nobody does."
atoms       = ["sys-devel/distcc"]

# Distributing compilation has two halves and they fail differently, so both are
# checked here: distcc itself must work (checks 1-3), and portage must actually route
# its compiles through it (check 4) — FEATURES is spec-owned, so that half is a line
# in aios.toml and nothing the agent can set.
#
# Check 4 used to be the FEATURES grep alone, and that was vacuous: make.conf carries
# the line whether or not the package exists, so on a machine with portage and no
# distcc the check passed and the probe read 1/4 instead of 0/4. Verified with a
# stand-in `emerge --info` and no distcc installed. It now names the binary too, so
# neither half can carry the other.
#
# The third check is the one to read twice. On this mesh NOBODY runs distccd today:
# ConductorAI advertises build capacity at package granularity and serves binpkgs, it
# does not accept compile jobs. So "no hosts" is the normal state, and a probe that
# called it a failure would be red on every machine forever and would take
# `forge minimize` down with it. What must be true is weaker and more useful: with an
# empty host list the compile still happens, locally, and produces working code.
#
# Nothing here needs a remote host, and nothing here may quietly acquire one: the
# host names below are .invalid (RFC 2606, can never resolve) and only reach a parser.

[[check]]
name = "distcc is installed and reports a version"
script = '''
command -v distcc
distcc --version | grep -qE 'distcc [0-9]+\.[0-9]'
'''

[[check]]
name = "distcc takes its host list from DISTCC_HOSTS"
script = '''
export DISTCC_DIR="$T/state"
export DISTCC_HOSTS="alpha.invalid/3 beta.invalid/1"
distcc --show-hosts > "$T/hosts"

grep -q 'alpha.invalid' "$T/hosts"
grep -q 'beta.invalid' "$T/hosts"
# Exactly the two that were asked for. This is what makes the check about the
# environment rather than about the machine: an /etc/distcc/hosts leaking in, or the
# variable being ignored, both show up here as the wrong count.
test "$(grep -c . "$T/hosts")" -eq 2
'''

[[check]]
name = "with no hosts at all, a compile still succeeds by falling back to local"
script = '''
export DISTCC_DIR="$T/state"
export DISTCC_HOSTS=""
export DISTCC_FALLBACK=1

printf 'int answer(void) { return 42; }\n' > "$T/u.c"
printf 'int answer(void);\nint main(void) { return answer() == 42 ? 0 : 1; }\n' > "$T/m.c"

distcc gcc -O2 -c "$T/u.c" -o "$T/u.o"
distcc gcc -O2 -c "$T/m.c" -o "$T/m.o"
test -s "$T/u.o"

# Not "distcc exited 0": the objects have to be real code. Linking them and running
# the result is the observable effect, and it is what a silent fallback to a broken
# local compiler would fail.
gcc -o "$T/prog" "$T/m.o" "$T/u.o"
"$T/prog"
'''

[[check]]
name = "portage routes compiles through a distcc that is actually here"
script = '''
# Two assertions, deliberately in ONE check. FEATURES is rendered into make.conf
# from the spec whether or not sys-devel/distcc is installed, so the grep below
# passes on any machine that merely has portage — which is every real AIos node.
# Alone it is a vacuous check: it can go red for a missing emerge, never for a
# missing distcc. Pairing it with the binary is what makes the check's own subject
# able to fail it.
command -v distcc

# The spec-owned half. Whole-word match on purpose: a future "-distcc" negation or
# a "distcc-pump" line must not pass this check.
emerge --info | grep -oE 'FEATURES="[^"]*"' | grep -qE '[ "]distcc[ "]'
'''
