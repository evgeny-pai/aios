# tmux for an AIos machine. Loaded explicitly with -f, never from $HOME, so the
# layout is a property of the machine rather than of whoever last logged in.
#
# intent[3] asks for two panes and no mouse. Everything here serves that or gets out
# of the way; a multiplexer you have to configure is a multiplexer that failed.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"   # truecolor, so the welcome screen renders

set -g mouse off                                  # intent[3]: no mouse
set -g history-limit 50000                        # a build log is worth scrolling back through
set -g base-index 0
set -g escape-time 10
set -g focus-events on
set -g bell-action none

# The panes are named, because "which one is the agent" should not need working out.
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[bold],}#{pane_index}: #{pane_title} "

# One accent, the same #7FA8C9 the welcome screen and the agent prompt use — the
# three surfaces are one continuous machine, not three programs.
set -g pane-border-style "fg=#3a4550"
set -g pane-active-border-style "fg=#7fa8c9"
set -g status-style "bg=default fg=#828a94"
set -g status-left " #[fg=#7fa8c9,bold]aios#[default] #S "
set -g status-left-length 30
set -g status-right "#[fg=#5e6670]#(cat /aios/.aios/generation 2>/dev/null | sed 's/^/gen /') #[fg=#828a94]%H:%M "
set -g window-status-current-style "fg=#7fa8c9"

# A long build lives in pane 1; keep it easy to reach and hard to lose.
bind -n M-Up   select-pane -U
bind -n M-Down select-pane -D
bind r source-file /etc/aios/tmux.conf \; display " tmux.conf reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Detaching must be obvious, because the whole point is that work survives it.
bind d detach-client \; display " detached — the agent keeps working"
