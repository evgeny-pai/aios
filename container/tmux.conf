# tmux for an AIos machine — the cockpit. Loaded explicitly with -f, never from
# $HOME, so the layout is a property of the machine rather than of whoever last
# logged in.
#
# Three panes, one window. container/aios-login builds the geometry first and only
# then starts the programs, which is what makes the indices below true — tmux numbers
# panes by position, so the split of the left column inserts itself as 1 and pushes
# the right column to 2:
#
#   0  left, top      the agent prompt. The session attaches here and nothing in
#                     this file ever selects another pane, so the prompt cannot be
#                     taken away from you by something printing in another pane.
#   1  left, bottom   a root shell, for watching a build.
#   2  right, full     the live dashboard — python3 -m aios.supervisor.
#
# Pane 0 is only about thirteen rows, which is why the manifest is not printed into
# it: 21 lines of it would push its own top off the screen. F4 opens it in a window
# of its own, at the full width it is measured for.
#
# The keys are advertised in pane 0 from aios/dashboard.py's KEYS, and
# aios/test_cockpit.py asserts every one of them is bound here. A cockpit whose
# cheat sheet disagrees with its bindings is worse than no cheat sheet.
#
# A runaway multiplexer goes away with `tmux kill-server` — it takes every pane and
# client with it, and unlike `pkill -f tmux` it cannot match its own command line
# (skills/pkill-self-match).

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"   # truecolor, so the welcome screen renders

set -g mouse on                                   # click to focus, wheel to scroll back
set -g history-limit 50000                        # a build log is worth scrolling back through
set -g base-index 0
setw -g pane-base-index 0                         # F1/F2/F3 target 0, 1, 2
set -g escape-time 10
set -g focus-events on

# Nothing may steal pane 0. Two loops print continuously in panes 1 and 2, and every
# one of these options is a way tmux would otherwise let output pull the human's
# attention — or their keystrokes — somewhere they did not ask to be.
set -g bell-action none
set -g visual-bell off
set -g visual-activity off
set -g visual-silence off
setw -g monitor-activity off
setw -g monitor-bell off

# The panes are named, because "which one is the agent" should not need working out.
# Titles are set by aios-login with `select-pane -T`, and nothing running inside a
# pane gets to rename it: a border reading "dashboard" over the shell would be worse
# than no border, and the journal's contents reach these panes.
set -g allow-rename off
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[bold],}#{pane_index}: #{pane_title} "

# One accent, the same #7FA8C9 the welcome screen, the agent prompt and the
# dashboard use — the surfaces are one continuous machine, not four programs.
set -g pane-border-style "fg=#3a4550"
set -g pane-active-border-style "fg=#7fa8c9"

# The status bar is the "something is happening / nothing is stuck" display, so it
# is at the top where the eye already is, and it is driven by ONE cheap command:
# a pure reader of .aios/agent.jsonl with no model call, no network and no
# subprocess. tmux runs a status job in the background and keeps the previous value
# until it returns, so a slow reader would show a stale machine — which is why that
# command tails the journal instead of reading it, and prints `?` for anything it
# cannot determine rather than the last thing it knew.
set -g status-position top
set -g status-interval 2
set -g status-style "bg=default fg=#828a94"
set -g status-left " #[fg=#7fa8c9,bold]aios#[default] #S "
set -g status-left-length 30
set -g status-right '#(cd "${AIOS_ROOT:-/aios}" && PYTHONPATH="${AIOS_ROOT:-/aios}" python3 -m aios.dashboard status) '
set -g status-right-length 80
set -g window-status-current-style "fg=#7fa8c9"

# Panes by number: the prompt is F1 and it is always one keystroke away, with no
# prefix to remember while a build is scrolling past.
bind -n F1 select-pane -t :.0
bind -n F2 select-pane -t :.1
bind -n F3 select-pane -t :.2

# F4: the manifest — the machine reporting what it is made of, and the one screen
# that does not fit in pane 0. A window of its own rather than a pane, because it is
# measured for up to 88 columns and the left column is 49; it closes on Enter, and
# nothing in the cockpit is disturbed while it is open.
bind -n F4 new-window -n manifest 'cd "${AIOS_ROOT:-/aios}" && PYTHONPATH="${AIOS_ROOT:-/aios}" python3 -m aios.welcome; printf "\n  enter closes this "; read -r _'

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind z resize-pane -Z
bind r source-file /etc/aios/tmux.conf \; display " tmux.conf reloaded"

# Restated, not inherited: pane 0's cheat sheet sheds its tail on a short pane and
# points here for the rest, so this has to be a binding this file guarantees rather
# than a default a later `unbind` could take away.
bind ? list-keys

# Detaching must be obvious, because the whole point is that work survives it.
bind d detach-client \; display " detached — the machine keeps working"
