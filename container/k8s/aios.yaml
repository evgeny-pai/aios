# The AIos machine, as a pod.
#
# A Pod rather than a Deployment on purpose: this is one machine with an identity,
# not a replicable stateless workload. Rescheduling it somewhere else and calling
# it the same machine would be a lie.
apiVersion: v1
kind: Namespace
metadata:
  name: aios
  labels:
    aios.dev/managed: "true"
---
# NOTE: the agent's credentials are deliberately NOT declared here.
#
# An earlier version of this file shipped the Secret with `ANTHROPIC_API_KEY: ""`,
# which meant every `kubectl apply` — including every run of container/build.sh —
# silently reset the key to empty and the agent quietly went offline. A manifest
# that destroys user state each time it is applied is worse than no manifest.
#
# Create it out-of-band instead; `envFrom` below is marked optional, so the machine
# boots with or without it:
#
#   kubectl -n aios create secret generic aios-agent \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-...
#   kubectl -n aios delete pod aios   # envFrom is injected at container start
#
---
# /aios is the machine's own source of truth — spec, lockfile, journal, overlay.
# On real hardware this is the data partition that survives both root slots
# (DESIGN.md §5); here it is a PVC for the same reason: generations come and go,
# the machine's description persists.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aios-state
  namespace: aios
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 4Gi
---
# What the machine BUILDS WITH and what it HAS BUILT, on storage that outlives the
# container.
#
# These three were ephemeral until 2026-07-27, and the cost of that was measured, not
# guessed: 793 MB of state — a 32,695-ebuild tree fetched by emerge-webrsync, the
# binary package cache, and the distfiles behind it — all sat in the container's
# writable layer, where a colima restart or an OOM kill erases them. The repo focus
# carried a "do NOT delete the pod" warning for weeks, which is a sticky note doing a
# volume's job. The Service comment below already claimed this node "holds the ebuild
# tree, the binary package cache, and the source releases its peers update from";
# nothing backed that claim with storage.
#
# NOT on this list, deliberately: /var/db/pkg. The installed database describes files
# under /usr that live in the ephemeral layer, so persisting the database alone would
# survive a recreate that removed the binaries it describes — the machine would insist
# tmux is installed with no /usr/bin/tmux. Losing the database is loud and recoverable;
# a database that lies is neither. It comes fresh from the image, and the packages come
# back from binpkgs below, which is the project's own thesis applied to itself: the
# machine reconstitutes from a lockfile plus its own cache.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aios-portage
  namespace: aios
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 4Gi # 704 MB of tree today; headroom for it to grow with sync
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aios-binpkgs
  namespace: aios
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      # The seed the rest of the network pulls from, and what makes `forge minimize`
      # affordable — it writes one build per lever, so this grows fastest of the three.
      # 549 MB for 295 packages today.
      storage: 16Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aios-distfiles
  namespace: aios
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 4Gi
---
# The compiler cache. This was ephemeral until 2026-07-28 and that quietly cost the
# whole point of FEATURES="ccache": make.conf sets CCACHE_DIR=/var/cache/ccache and
# CCACHE_SIZE=20G, so the machine was told to keep 20 GB of compile results in a
# directory that a pod recreate resets to empty. `forge minimize` rebuilds a package
# once per lever and is the workload ccache exists to make affordable — with an
# ephemeral cache every lever paid full compile price again after any restart.
#
# Sized to CCACHE_SIZE rather than guessed; keep the two in step if either changes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aios-ccache
  namespace: aios
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
# What this node SERVES: aios.repo.serve() builds /srv/aios (symlinks to the tree and
# the binpkg cache) and aios.update.publish writes source releases plus latest.json
# under AIOS_SRC_DIR=/srv/aios/src. Peers `check` and `apply` against exactly that
# manifest, so an ephemeral /srv/aios means every pod recreate silently retracts every
# release this node had published and any git repository hosted beside them.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aios-srv
  namespace: aios
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
# The first node to sync becomes the seed of the network: it holds the ebuild tree,
# the binary package cache, and the source releases its peers update from. Every node
# after it is cheap, which is what makes `forge minimize` — one rebuild per lever —
# affordable at all.
#
# Named aios-repo rather than aios so a peer's config never has to know which node is
# currently serving; move the label and the name follows.
apiVersion: v1
kind: Service
metadata:
  name: aios-repo
  namespace: aios
spec:
  selector:
    app: aios
    aios.dev/role: repo
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    # distccd. This node accepts compile jobs as well as sending them, so the port a
    # distcc client dials is part of the node's published surface, exactly like the
    # tree and the binpkgs above. In-cluster reachability only: the cluster
    # deliberately binds no host ports (see kind-cluster.yaml), so a client outside
    # the cluster reaches it through `kubectl port-forward`, not through the node.
    - name: distcc
      port: 3632
      targetPort: 3632
---
apiVersion: v1
kind: Pod
metadata:
  name: aios
  namespace: aios
  labels:
    app: aios
    # This node serves the tree. Remove the label to take it out of rotation without
    # deleting anything.
    aios.dev/role: repo
spec:
  # A machine that self-modifies must not be silently replaced when it exits.
  restartPolicy: OnFailure
  terminationGracePeriodSeconds: 5
  containers:
    - name: aios
      image: aios:latest
      imagePullPolicy: Never # loaded into the node with `kind load`, never fetched
      # A real terminal, so `kubectl attach` and `kubectl exec -it` get a tty and
      # the welcome screen renders with colour instead of raw escape codes.
      tty: true
      stdin: true
      stdinOnce: false
      env:
        # Deliberately NO AIOS_PROVIDER / AIOS_MODEL here. Those env vars override
        # aios.toml, so setting them made the spec unchangeable from inside the
        # machine: an agent editing `[agent] provider` saw its own edit have no
        # effect and looped trying to work out why. The spec is the source of truth;
        # the env vars stay available as a deliberate operator override.
        - name: TERM
          value: xterm-256color
        - name: COLORTERM
          value: truecolor
        # The ConductorAI share daemon runs on the HOST, not in the cluster, and
        # binds 0.0.0.0:4748. host.docker.internal is the only route a pod has to
        # it. A URL is not a credential, so it belongs here; the token does not.
        - name: AIOS_MESH_URL
          value: http://host.docker.internal:4748
        # The buzz relay this node registers on, announces its capabilities to, and
        # asks questions of. Same category as AIOS_MESH_URL above — topology, not a
        # credential — and the same route, because a relay runs on the HOST (it needs
        # postgres, redis and object storage beside it) while this is a pod.
        #
        # A URL pointing at nothing is harmless and deliberate: aios-init reports "not
        # registered" and boots normally, so this can be set before a relay exists.
        # The node's identity key is minted on the state volume, never injected here —
        # a secret in a manifest is destroyed by the next `apply`
        # (see the aios-agent note at the top of this file).
        - name: AIOS_BUZZ_URL
          value: http://host.docker.internal:3000
        # Where the LOCAL model lives, for the spec's `fallback` provider chain.
        #
        # Not an AIOS_PROVIDER/AIOS_MODEL override — those are still deliberately absent
        # because they make the spec unchangeable from inside the machine. These two are
        # topology, the same category as AIOS_MESH_URL above: the spec says "prefer a
        # local model", and this says which daemon that is. Ollama runs on the HOST
        # (it needs the GPU), so host.docker.internal is the route, exactly as for the
        # share daemon.
        #
        # AIOS_OLLAMA_MODEL rather than AIOS_MODEL because a chain spans backends and
        # `qwen3:14b` means nothing to the hosted API.
        - name: OLLAMA_HOST
          value: http://host.docker.internal:11434
        - name: AIOS_OLLAMA_MODEL
          value: qwen3:14b
        # Self-update source. A node's peer-manifest update path (AIOS_UPDATE_URL,
        # above) has nothing to fetch until another node publishes to it; the git
        # remote this code was built from always exists, so it is the default rather
        # than something a lone node waits on a peer to provide. HTTPS, not the SSH
        # remote a workstation clone uses — the pod carries no SSH key or known_hosts,
        # and this is a public repo, so an unauthenticated clone is the right shape.
        - name: AIOS_GIT_REMOTE
          value: https://github.com/evgeny-pai/aios.git
        - name: AIOS_GIT_BRANCH
          value: main
        # Cheap to poll, but not free: git ls-remote is one round trip per interval,
        # forever, for the life of the pod. Five minutes is the repo server's
        # `--for=condition=Ready` timeout with room to spare, not a measurement.
        - name: AIOS_GIT_POLL_INTERVAL
          value: "300"
      envFrom:
        # Both optional: the pod must boot when no credentials have been created
        # yet, and must never be blocked from starting by their absence. A machine
        # off the mesh with no model key is still a machine that boots and serves.
        - secretRef:
            name: aios-agent
            optional: true
        # CONDUCTORAI_SHARE_TOKEN. Created out-of-band from ~/.conductorai/config.json
        # for the same reason as aios-agent — a manifest that declares a credential
        # destroys it on every apply:
        #
        #   kubectl -n aios create secret generic aios-mesh \
        #     --from-literal=CONDUCTORAI_SHARE_TOKEN="$(...)"
        - secretRef:
            name: aios-mesh
            optional: true
      volumeMounts:
        - name: state
          mountPath: /aios/.aios
        - name: portage
          mountPath: /var/db/repos/gentoo
        - name: binpkgs
          mountPath: /var/cache/binpkgs
        - name: distfiles
          mountPath: /var/cache/distfiles
        - name: ccache
          mountPath: /var/cache/ccache
        - name: srv
          mountPath: /srv/aios
      resources:
        # MAKEOPTS is -j8 (spec: system.makeopts), so a cpu limit of 3 meant eight
        # compile jobs fighting over a three-core quota on a ten-core machine — the
        # build was slow for a reason that had nothing to do with the compiler. The
        # limit is 8 to match -j8; keep the two in step if either changes.
        #
        # The limit may exceed what the colima VM currently has. That is deliberate:
        # a limit above node capacity is simply never reached, so the pod uses whatever
        # the VM has today and the full eight the day the VM is widened, with no
        # manifest edit in between. `requests` is what must stay schedulable.
        requests:
          cpu: "500m"
          memory: 1Gi
        limits:
          cpu: "8"
          memory: 8Gi
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        # emerge needs to write across the filesystem, and the whole point is a
        # machine that rebuilds itself. Confinement is the cluster boundary here.
        readOnlyRootFilesystem: false
        allowPrivilegeEscalation: true
        capabilities:
          drop: [NET_RAW]
  volumes:
    - name: state
      persistentVolumeClaim:
        claimName: aios-state
    - name: portage
      persistentVolumeClaim:
        claimName: aios-portage
    - name: binpkgs
      persistentVolumeClaim:
        claimName: aios-binpkgs
    - name: distfiles
      persistentVolumeClaim:
        claimName: aios-distfiles
    - name: ccache
      persistentVolumeClaim:
        claimName: aios-ccache
    - name: srv
      persistentVolumeClaim:
        claimName: aios-srv
