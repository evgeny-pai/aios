# AIos machine spec. Describe what you do; forge decides what to compile.

[system]
name     = "aios-dev"
arch     = "aarch64"           # aarch64 | x86_64
libc     = "musl"              # musl | glibc
init     = "dinit"             # no systemd
profile  = "default"
cflags   = "-O2 -pipe"
makeopts = "-j8"

# buildpkg is load-bearing, not an optimisation: forge minimize rebuilds a package
# once per lever, and a node serves its binary packages to the rest of the network.
# ccache and distcc are the other two halves of making that affordable, and they
# compose in this order: ccache answers first, and only a miss goes out to distcc.
# Both are here rather than in the lock because FEATURES is spec-owned — a live
# lowering did propose "ccache buildpkg parallel-fetch" and was overruled for it
# (see the note in aios.lock.json), which is why a human has to write it once.
# distcc distributes individual compile jobs; WHICH machines it distributes to is
# topology and never enters the lockfile — `python3 -m aios.mesh distcc` reads that
# from the mesh at build time, and no host at all means every compile runs here.
# The sandbox set is off because this machine is a container — portage's ipc/pid/
# network sandboxes call unshare(), which a stock pod cannot do:
#   Unable to unshare: EPERM (for FEATURES="pid-sandbox")
# and userpriv then fails to chmod files it does not own. On real hardware, drop the
# negations; this line describes THIS machine, which is the point of the spec.
features = "buildpkg parallel-fetch ccache distcc -sandbox -usersandbox -userpriv -ipc-sandbox -network-sandbox -pid-sandbox"

[agent]
# `fallback` asks the local model first and the hosted one only if that fails —
# unreachable daemon, timeout, or an answer the lowering validator rejects. The chain
# is AIOS_FALLBACK_CHAIN (default "ollama,anthropic") and each link takes its model
# from AIOS_<LINK>_MODEL, because `qwen3:14b` and `claude-opus-5` cannot share one
# AIOS_MODEL. Measured on qwen3:14b: it returns schema-valid JSON but folds the sign
# into USE flag names ("-X11"), which the validator refuses, so in practice the hosted
# model still produces the lock — the local attempt costs one call and keeps the spec
# on the premises when a bigger local model can hold the contract.
provider = "fallback"          # fallback | anthropic | openai | ollama | echo
model    = ""                  # empty = provider default
effort   = "medium"            # low | medium | high | xhigh | max

# Each intent is one thing you actually do. Name the probes that prove it still
# works — an intent with no probes can be lowered, but never minimized against.

[[intent]]
text   = "edit code over ssh: syntax highlighting, multiple buffers, no X11 and no clipboard integration"
probes = ["vim"]

[[intent]]
text   = "build small C projects locally with make"
probes = []

[[intent]]
text   = "reach the machine over ssh with key auth only, no password auth, no X forwarding"
probes = []

[[intent]]
text   = "never block the terminal on a long build: a terminal multiplexer that starts split into two panes, so a compile can run in one while I keep working in the other. Scriptable session and pane control from the shell. No mouse, no clipboard, no X."
probes = ["tmux"]

[[intent]]
text   = "serve this machine's ebuild tree and binary packages to other AIos nodes over HTTP, and take code updates from a peer the same way"
probes = []

# forge minimize rebuilds one package once per lever — a dozen near-identical
# compiles of the same source. A compiler cache is the difference between that being
# an afternoon and being a coffee break.
[[intent]]
text   = "rebuild the same package repeatedly without recompiling what did not change: a compiler cache sized for a few full package builds, shared across every build on this machine"
probes = ["ccache"]

# The cache above makes the SECOND build of something cheap. This makes the first one
# cheap, when there is anyone to share it with — and says nothing about who that is,
# because that changes hourly and the lockfile has to be stable.
[[intent]]
text   = "when this machine is compiling something large and other machines on the network are offering spare capacity, hand them the individual compile jobs instead of doing all of them here; when nobody is offering, compile everything locally without treating that as a failure"
probes = ["distcc"]
